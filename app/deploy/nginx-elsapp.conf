# Els App versi web — https://elsapp.eccchurch.global
# Static SPA hasil `npx expo export -p web` (app.json web.output = "single").
#
# Pasang (di VPS, sebagai root):
#   certbot certonly --nginx -d elsapp.eccchurch.global --email admin@eccchurch.global --agree-tos --no-eff-email
#   cp nginx-elsapp.conf /etc/nginx/sites-available/elsapp.eccchurch.global
#   ln -s /etc/nginx/sites-available/elsapp.eccchurch.global /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name elsapp.eccchurch.global;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elsapp.eccchurch.global;

    ssl_certificate /etc/letsencrypt/live/elsapp.eccchurch.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elsapp.eccchurch.global/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/elsapp;
    index index.html;

    # Security headers. Token login disimpan di localStorage → CSP membatasi
    # sumber script (mitigasi XSS). connect-src: API + landing (payment).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.eccchurch.global; media-src 'self' blob: https:; frame-src https:; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Bundle ber-hash → cache 1 tahun.
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: semua route (event/:id, homecell/:id, ...) → index.html.
    # index.html selalu no-cache supaya deploy baru langsung terpakai.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.eccchurch.global; media-src 'self' blob: https:; frame-src https:; frame-ancestors 'none'; base-uri 'self'" always;
    }
}
